        icon: "🎸"
    }
];


/* =========================
   KOLEKSİYON
========================= */

let owned = [];

try {
    const saved = localStorage.getItem("ownedSkins");

    if (saved) {
        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
            owned = parsed;
        }
    }
} catch (error) {
    owned = [];
    localStorage.removeItem("ownedSkins");
}


function saveOwned() {
    try {
        localStorage.setItem(
            "ownedSkins",
            JSON.stringify(owned)
        );
    } catch (error) {
        console.log("Kayıt hatası:", error);
    }
}


function toggleOwned(name) {

    if (owned.includes(name)) {

        owned = owned.filter(
            skin => skin !== name
        );

    } else {

        owned.push(name);

    }

    saveOwned();
    renderSkins();
}


/* =========================
   SKİNLERİ GÖSTER
========================= */

function renderSkins() {

    const searchInput =
        document.getElementById("search");

    const brawlerFilter =
        document.getElementById("brawlerFilter");

    const rarityFilter =
        document.getElementById("rarityFilter");

    const grid =
        document.getElementById("skinGrid");


    if (!searchInput || !brawlerFilter || !rarityFilter || !grid) {
        console.error("Gerekli HTML elemanlarından biri bulunamadı.");
        return;
    }


    const search =
        searchInput.value
        .trim()
        .toLowerCase();


    const selectedBrawler =
        brawlerFilter.value;


    const selectedRarity =
        rarityFilter.value;


    const filtered =
        skins.filter(skin => {

            const searchMatch =
                skin.name.toLowerCase().includes(search) ||
                skin.brawler.toLowerCase().includes(search);


            const brawlerMatch =
                selectedBrawler === "all" ||
                skin.brawler === selectedBrawler;


            const rarityMatch =
                selectedRarity === "all" ||
                skin.rarity === selectedRarity;


            return (
                searchMatch &&
                brawlerMatch &&
                rarityMatch
            );

        });


    grid.innerHTML = "";


    if (filtered.length === 0) {

        grid.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px;
                color:#aaa;
                font-size:18px;
            ">
                😕 Aramana uygun skin bulunamadı.
            </div>
        `;

    } else {

        filtered.forEach(skin => {

            const isOwned =
                owned.includes(skin.name);


            const card =
                document.createElement("div");

            card.className = "skin";


            card.innerHTML = `

                <div class="skin-image">
                    ${skin.icon}
                </div>

                <div class="skin-info">

                    <h3>${skin.name}</h3>

                    <div class="brawler">
                        ${skin.brawler}
                    </div>

                    <div class="price">
                        ${skin.price}
                    </div>

                    <span class="rarity">
                        ${skin.rarity}
                    </span>

                    <button class="owned ${isOwned ? "active" : ""}">
                        ${
                            isOwned
                            ? "✅ Koleksiyonumda"
                            : "＋ Koleksiyonuma Ekle"
                        }
                    </button>

                </div>
            `;


            const button =
                card.querySelector(".owned");


            button.addEventListener(
                "click",
                () => toggleOwned(skin.name)
            );


            grid.appendChild(card);

        });

    }


    const collectionCount =
        document.getElementById("collectionCount");

    const totalCount =
        document.getElementById("totalCount");


    if (collectionCount) {
        collectionCount.textContent =
            owned.length;
    }


    if (totalCount) {
        totalCount.textContent =
            skins.length;
    }

}


/* =========================
   HESABIM
========================= */

function showAccount() {

    const input =
        document.getElementById("playerTag");

    const result =
        document.getElementById("accountResult");


    if (!input || !result) {
        return;
    }


    let tag =
        input.value.trim();


    if (!tag) {

        result.innerHTML = `
            <div style="color:#ff5959;">
                ⚠️ Önce oyuncu etiketini yaz.
            </div>
        `;

        return;
    }


    if (!tag.startsWith("#")) {
        tag = "#" + tag;
    }


    result.innerHTML = `

        <h3 style="color:#ffd21f;">
            🎮 Oyuncu Etiketi
        </h3>

        <p style="
            margin-top:12px;
            font-size:20px;
            font-weight:bold;
        ">
            ${tag}
        </p>

        <div style="
            margin-top:20px;
            padding:15px;
            background:#111522;
            border-radius:12px;
            color:#aaa;
        ">
            Hesap bilgileri için gerçek API bağlantısı
            sonraki aşamada eklenecek.
        </div>

    `;
}


/* =========================
   EVENTLER
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderSkins
    );


document
    .getElementById("brawlerFilter")
    .addEventListener(
        "change",
        renderSkins
    );


document
    .getElementById("rarityFilter")
    .addEventListener(
        "change",
        renderSkins
    );


/* =========================
   BAŞLANGIÇ
========================= */

renderSkins();

</script>
