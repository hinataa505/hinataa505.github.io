<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brawl Hub - Skin Kataloğu</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #303b70, #111522 60%);
    color: white;
    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

header {
    background: rgba(10,13,25,.96);
    border-bottom: 3px solid #ffd21f;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    color: #ffd21f;
    font-size: 28px;
    font-weight: 900;
    text-shadow: 3px 3px #000;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: bold;
    transition: .2s;
}

nav a:hover {
    color: #ffd21f;
}

/* =========================
   HERO
========================= */

.hero {
    text-align: center;
    padding: 65px 20px 45px;
}

.hero h1 {
    font-size: 58px;
    color: #ffd21f;
    text-shadow: 5px 5px #000;
}

.hero p {
    margin-top: 12px;
    color: #ddd;
    font-size: 18px;
}

/* =========================
   CONTROLS
========================= */

.controls {
    width: 90%;
    max-width: 1150px;
    margin: auto;
    background: rgba(20,25,45,.96);
    padding: 25px;
    border-radius: 18px;
    border: 2px solid #303752;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.search {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: 2px solid transparent;
    outline: none;
    font-size: 17px;
    background: #0d101b;
    color: white;
    transition: .2s;
}

.search:focus {
    border-color: #ffd21f;
}

.filters {
    display: flex;
    gap: 12px;
    margin-top: 15px;
    flex-wrap: wrap;
}

select {
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: #292f48;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.collection {
    margin-top: 18px;
    color: #ffd21f;
    font-weight: bold;
}

/* =========================
   SKINLER
========================= */

.skin-container {
    width: 90%;
    max-width: 1200px;
    margin: 40px auto;
}

.section-title {
    margin-bottom: 20px;
    color: #ffd21f;
    font-size: 25px;
}

.skin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.skin {
    background: linear-gradient(145deg, #1d2540, #151a2c);
    border: 2px solid #303752;
    border-radius: 18px;
    padding: 20px;
    transition: .2s;
}

.skin:hover {
    transform: translateY(-6px);
    border-color: #ffd21f;
    box-shadow: 0 10px 25px rgba(0,0,0,.25);
}

.skin h3 {
    font-size: 20px;
    margin-bottom: 10px;
}

.brawler {
    color: #aaa;
    margin-bottom: 12px;
}

.price {
    color: #ffd21f;
    font-weight: bold;
    margin-bottom: 12px;
}

.rarity {
    display: inline-block;
    padding: 6px 9px;
    border-radius: 7px;
    background: #313956;
    font-size: 12px;
    font-weight: bold;
}

.owned {
    margin-top: 15px;
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 9px;
    background: #303750;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

.owned:hover {
    background: #414b70;
}

.owned.active {
    background: #23a455;
}

/* =========================
   HESABIM
========================= */

.account {
    width: 90%;
    max-width: 900px;
    margin: 80px auto;
    background: rgba(20,25,45,.97);
    padding: 35px;
    border-radius: 22px;
    border: 2px solid #303752;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,.3);
}

.account h2 {
    color: #ffd21f;
    margin-bottom: 25px;
    font-size: 30px;
}

.profile-card {
    background: #101525;
    border: 2px solid #303752;
    border-radius: 18px;
    padding: 25px;
}

.profile-icon {
    width: 75px;
    height: 75px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: #e83b32;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    border: 3px solid #ffd21f;
}

.profile-name {
    font-size: 25px;
    font-weight: bold;
    color: white;
}

.profile-tag {
    margin-top: 7px;
    color: #aaa;
    font-size: 15px;
}

.account-status {
    margin-top: 20px;
    display: inline-block;
    padding: 8px 13px;
    border-radius: 8px;
    background: #303750;
    color: #ffd21f;
    font-weight: bold;
}

.account-info {
    margin-top: 20px;
    color: #888;
    line-height: 1.6;
}

/* =========================
   FOOTER
========================= */

footer {
    margin-top: 80px;
    background: #090b12;
    text-align: center;
    padding: 25px;
    color: #777;
}

/* =========================
   MOBİL
========================= */

@media(max-width:700px) {

    header {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 0 7px;
        font-size: 14px;
    }

    .hero h1 {
        font-size: 40px;
    }

    .controls {
        width: 94%;
    }

    .skin-container {
        width: 94%;
    }

    .account {
        width: 94%;
        padding: 25px 15px;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">
        🔥 BRAWL HUB
    </div>

    <nav>
        <a href="#skins">Skinler</a>
        <a href="#hesabim">Hesabım</a>
    </nav>

</header>


<section class="hero">

    <h1>BRAWL HUB</h1>

    <p>
        Brawl Stars Türkçe Skin Kataloğu
    </p>

</section>


<section class="controls">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Skin veya brawler ara..."
    >

    <div class="filters">

        <select id="brawlerFilter">

            <option value="all">
                Tüm Brawlerlar
            </option>

        </select>


        <select id="rarityFilter">

            <option value="all">
                Tüm Nadirlikler
            </option>

            <option value="Rare">
                Ender
            </option>

            <option value="Super Rare">
                Süper Ender
            </option>

            <option value="Epic">
                Destansı
            </option>

            <option value="Mythic">
                Gizemli
            </option>

            <option value="Legendary">
                Efsanevi
            </option>

        </select>

    </div>


    <div class="collection">

        Koleksiyon:
        <span id="collectionCount">0</span>
        /
        <span id="totalCount">0</span>

    </div>

</section>


<section id="skins" class="skin-container">

    <h2 class="section-title">
        🎨 Skinler
    </h2>

    <div
        id="skinGrid"
        class="skin-grid"
    ></div>

</section>


<section id="hesabim" class="account">

    <h2>
        🎮 HESABIM
    </h2>

    <div class="profile-card">

        <div class="profile-icon">
            👤
        </div>

        <div class="profile-name">
            Benim Brawl Stars Hesabım
        </div>

        <div class="profile-tag">
            #98RRL9GYQ
        </div>

        <div class="account-status">
            🔒 Kişisel Hesap
        </div>

        <div class="account-info">

            Gerçek hesap istatistikleri ve brawler
            bilgileri API bağlantısı tamamlandığında
            burada gösterilecek.

        </div>

    </div>

</section>


<footer>

    © 2026 Brawl Hub

</footer>


<script>

/* =========================
   SKIN VERİLERİ
========================= */

const skins = [

    {
        name: "Bandita Shelly",
        brawler: "Shelly",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Star Shelly",
        brawler: "Shelly",
        price: "Özel",
        rarity: "Legendary"
    },

    {
        name: "Korsan Colt",
        brawler: "Colt",
        price: "29 💎",
        rarity: "Rare"
    },

    {
        name: "Ajan Colt",
        brawler: "Colt",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Sakura Spike",
        brawler: "Spike",
        price: "79 💎",
        rarity: "Super Rare"
    },

    {
        name: "Robo Spike",
        brawler: "Spike",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Kurt Adam Leon",
        brawler: "Leon",
        price: "199 💎",
        rarity: "Mythic"
    },

    {
        name: "Mecha Crow",
        brawler: "Crow",
        price: "299 💎",
        rarity: "Legendary"
    },

    {
        name: "Gece Mecha Crow",
        brawler: "Crow",
        price: "299 💎",
        rarity: "Legendary"
    },

    {
        name: "Rockabilly Mortis",
        brawler: "Mortis",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Deli Mortis",
        brawler: "Mortis",
        price: "79 💎",
        rarity: "Super Rare"
    },

    {
        name: "Ninja Tara",
        brawler: "Tara",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Korsan Poco",
        brawler: "Poco",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "DJ Frank",
        brawler: "Frank",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Ejderha Şövalyesi Jessie",
        brawler: "Jessie",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Korsan Penny",
        brawler: "Penny",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Ay Savaşçısı Lola",
        brawler: "Lola",
        price: "199 💎",
        rarity: "Mythic"
    },

    {
        name: "Fırtına Tara",
        brawler: "Tara",
        price: "199 💎",
        rarity: "Mythic"
    },

    {
        name: "Cyberpunk Brock",
        brawler: "Brock",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Mecha Bo",
        brawler: "Bo",
        price: "299 💎",
        rarity: "Legendary"
    }

];


/* =========================
   BRAWLER FİLTRESİ
========================= */

const brawlers = [
    ...new Set(
        skins.map(
            skin => skin.brawler
        )
    )
].sort();


const brawlerFilter =
    document.getElementById(
        "brawlerFilter"
    );


brawlers.forEach(
    brawler => {

        const option =
            document.createElement(
                "option"
            );

        option.value = brawler;

        option.textContent =
            brawler;

        brawlerFilter.appendChild(
            option
        );

    }
);


/* =========================
   KOLEKSİYON
========================= */

let owned = [];


try {

    const saved =
        localStorage.getItem(
            "ownedSkins"
        );

    if (saved) {

        const parsed =
            JSON.parse(saved);

        if (Array.isArray(parsed)) {
            owned = parsed;
        }

    }

} catch {

    owned = [];

}


function saveOwned() {

    localStorage.setItem(
        "ownedSkins",
        JSON.stringify(owned)
    );

}


function toggleOwned(name) {

    if (owned.includes(name)) {

        owned =
            owned.filter(
                skin => skin !== name
            );

    } else {

        owned.push(name);

    }

    saveOwned();

    renderSkins();

}


/* =========================
   SKİNLERİ GÖSTER
========================= */

function renderSkins() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const selectedBrawler =
        document
            .getElementById(
                "brawlerFilter"
            )
            .value;


    const selectedRarity =
        document
            .getElementById(
                "rarityFilter"
            )
            .value;


    const grid =
        document.getElementById(
            "skinGrid"
        );


    const filtered =
        skins.filter(
            skin => {

                const searchMatch =

                    skin.name
                        .toLowerCase()
                        .includes(search)

                    ||

                    skin.brawler
                        .toLowerCase()
                        .includes(search);


                const brawlerMatch =

                    selectedBrawler === "all"

                    ||

                    skin.brawler ===
                        selectedBrawler;


                const rarityMatch =

                    selectedRarity === "all"

                    ||

                    skin.rarity ===
                        selectedRarity;


                return (

                    searchMatch

                    &&

                    brawlerMatch

                    &&

                    rarityMatch

                );

            }
        );


    grid.innerHTML = "";


    if (
        filtered.length === 0
    ) {

        grid.innerHTML = `

            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px;
                color:#aaa;
            ">

                😕 Skin bulunamadı.

            </div>

        `;

    } else {

        filtered.forEach(
            skin => {

                const isOwned =
                    owned.includes(
                        skin.name
                    );


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "skin";


                card.innerHTML = `

                    <h3>
                        ${skin.name}
                    </h3>

                    <div class="brawler">
                        ${skin.brawler}
                    </div>

                    <div class="price">
                        ${skin.price}
                    </div>

                    <span class="rarity">
                        ${getTurkishRarity(
                            skin.rarity
                        )}
                    </span>

                    <button
                        class="owned ${
                            isOwned
                            ? "active"
                            : ""
                        }"
                    >

                        ${
                            isOwned
                            ? "✅ Koleksiyonumda"
                            : "＋ Koleksiyonuma Ekle"
                        }

                    </button>

                `;


                card
                    .querySelector(
                        ".owned"
                    )
                    .addEventListener(
                        "click",
                        () =>
                            toggleOwned(
                                skin.name
                            )
                    );


                grid.appendChild(
                    card
                );

            }
        );

    }


    document
        .getElementById(
            "collectionCount"
        )
        .textContent =
            owned.length;


    document
        .getElementById(
            "totalCount"
        )
        .textContent =
            skins.length;

}


/* =========================
   TÜRKÇE NADİRLİK
========================= */

function getTurkishRarity(
    rarity
) {

    const names = {

        Rare:
            "Ender",

        "Super Rare":
            "Süper Ender",

        Epic:
            "Destansı",

        Mythic:
            "Gizemli",

        Legendary:
            "Efsanevi"

    };


    return (
        names[rarity]
        ||
        rarity
    );

}


/* =========================
   EVENTLER
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderSkins
    );


document
    .getElementById(
        "brawlerFilter"
    )
    .addEventListener(
        "change",
        renderSkins
    );


document
    .getElementById(
        "rarityFilter"
    )
    .addEventListener(
        "change",
        renderSkins
    );


/* =========================
   BAŞLAT
========================= */

renderSkins();

</script>

</body>
</html>
