<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brawl Hub - Skin Kataloğu</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #303b70, #111522 60%);
    color: white;
    min-height: 100vh;
}

header {
    background: rgba(10,13,25,.95);
    border-bottom: 3px solid #ffd21f;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    color: #ffd21f;
    font-size: 28px;
    font-weight: 900;
    text-shadow: 3px 3px #000;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: bold;
}

nav a:hover {
    color: #ffd21f;
}

.hero {
    text-align: center;
    padding: 60px 20px 40px;
}

.hero h1 {
    font-size: 55px;
    color: #ffd21f;
    text-shadow: 5px 5px #000;
}

.hero p {
    margin-top: 12px;
    color: #ddd;
    font-size: 18px;
}

.controls {
    width: 90%;
    max-width: 1150px;
    margin: auto;
    background: rgba(20,25,45,.95);
    padding: 25px;
    border-radius: 18px;
    border: 2px solid #303752;
}

.search {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    outline: none;
    font-size: 17px;
    background: #0d101b;
    color: white;
}

.filters {
    display: flex;
    gap: 12px;
    margin-top: 15px;
    flex-wrap: wrap;
}

select {
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: #292f48;
    color: white;
    font-weight: bold;
}

.collection {
    margin-top: 18px;
    color: #ffd21f;
    font-weight: bold;
}

.skin-container {
    width: 90%;
    max-width: 1200px;
    margin: 40px auto;
}

.skin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.skin {
    background: #1a2035;
    border: 2px solid #303752;
    border-radius: 18px;
    padding: 20px;
    transition: .2s;
}

.skin:hover {
    transform: translateY(-6px);
    border-color: #ffd21f;
}

.skin h3 {
    font-size: 20px;
    margin-bottom: 10px;
}

.brawler {
    color: #aaa;
    margin-bottom: 12px;
}

.price {
    color: #ffd21f;
    font-weight: bold;
    margin-bottom: 12px;
}

.rarity {
    display: inline-block;
    padding: 6px 9px;
    border-radius: 7px;
    background: #313956;
    font-size: 12px;
    font-weight: bold;
}

.owned {
    margin-top: 15px;
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 9px;
    background: #303750;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.owned.active {
    background: #23a455;
}

.account {
    width: 90%;
    max-width: 900px;
    margin: 70px auto;
    background: rgba(20,25,45,.95);
    padding: 30px;
    border-radius: 20px;
    border: 2px solid #303752;
    text-align: center;
}

.account h2 {
    color: #ffd21f;
    margin-bottom: 20px;
}

.tag-input {
    display: flex;
    gap: 10px;
    max-width: 600px;
    margin: auto;
}

.tag-input input {
    flex: 1;
    padding: 15px;
    border-radius: 10px;
    border: none;
    outline: none;
}

.tag-input button {
    padding: 15px 22px;
    border: none;
    border-radius: 10px;
    background: #e83b32;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#accountResult {
    margin-top: 25px;
    color: #bbb;
}

footer {
    margin-top: 80px;
    background: #090b12;
    text-align: center;
    padding: 25px;
    color: #777;
}

@media(max-width:700px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 0 7px;
        font-size: 14px;
    }

    .hero h1 {
        font-size: 40px;
    }

    .tag-input {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🔥 BRAWL HUB</div>

    <nav>
        <a href="#skins">Skinler</a>
        <a href="#hesabim">Hesabım</a>
    </nav>
</header>

<section class="hero">
    <h1>BRAWL HUB</h1>
    <p>Brawl Stars Türkçe Skin Kataloğu</p>
</section>

<section class="controls">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Skin veya brawler ara..."
    >

    <div class="filters">

        <select id="brawlerFilter">
            <option value="all">Tüm Brawlerlar</option>
        </select>

        <select id="rarityFilter">
            <option value="all">Tüm Nadirlikler</option>
            <option value="Rare">Ender</option>
            <option value="Super Rare">Süper Ender</option>
            <option value="Epic">Destansı</option>
            <option value="Mythic">Gizemli</option>
            <option value="Legendary">Efsanevi</option>
        </select>

    </div>

    <div class="collection">
        Koleksiyon:
        <span id="collectionCount">0</span>
        /
        <span id="totalCount">0</span>
    </div>

</section>

<section id="skins" class="skin-container">
    <div id="skinGrid" class="skin-grid"></div>
</section>

<section id="hesabim" class="account">

    <h2>🎮 HESABIM</h2>

    <p style="color:#aaa;margin-bottom:20px;">
        Oyuncu etiketini buraya yaz.
    </p>

    <div class="tag-input">

        <input
            id="playerTag"
            placeholder="#OYUNCUETİKETİ"
        >

        <button id="accountButton">
            GÖSTER
        </button>

    </div>

    <div id="accountResult">
        Henüz oyuncu bilgisi girilmedi.
    </div>

</section>

<footer>
    © 2026 Brawl Hub
</footer>

<script>

/* =========================
   SKIN VERİLERİ
========================= */

const skins = [

    {
        name: "Bandita Shelly",
        brawler: "Shelly",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Star Shelly",
        brawler: "Shelly",
        price: "Özel",
        rarity: "Legendary"
    },

    {
        name: "Korsan Colt",
        brawler: "Colt",
        price: "29 💎",
        rarity: "Rare"
    },

    {
        name: "Ajan Colt",
        brawler: "Colt",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Sakura Spike",
        brawler: "Spike",
        price: "79 💎",
        rarity: "Super Rare"
    },

    {
        name: "Robo Spike",
        brawler: "Spike",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Kurt Adam Leon",
        brawler: "Leon",
        price: "199 💎",
        rarity: "Mythic"
    },

    {
        name: "Mecha Crow",
        brawler: "Crow",
        price: "299 💎",
        rarity: "Legendary"
    },

    {
        name: "Gece Mecha Crow",
        brawler: "Crow",
        price: "299 💎",
        rarity: "Legendary"
    },

    {
        name: "Rockabilly Mortis",
        brawler: "Mortis",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Deli Mortis",
        brawler: "Mortis",
        price: "79 💎",
        rarity: "Super Rare"
    },

    {
        name: "Ninja Tara",
        brawler: "Tara",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Korsan Poco",
        brawler: "Poco",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "DJ Frank",
        brawler: "Frank",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Ejderha Şövalyesi Jessie",
        brawler: "Jessie",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Korsan Penny",
        brawler: "Penny",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Ay Savaşçısı Lola",
        brawler: "Lola",
        price: "199 💎",
        rarity: "Mythic"
    },

    {
        name: "Fırtına Tara",
        brawler: "Tara",
        price: "199 💎",
        rarity: "Mythic"
    },

    {
        name: "Cyberpunk Brock",
        brawler: "Brock",
        price: "149 💎",
        rarity: "Epic"
    },

    {
        name: "Mecha Bo",
        brawler: "Bo",
        price: "299 💎",
        rarity: "Legendary"
    }

];


/* =========================
   BRAWLER FİLTRESİ
========================= */

const brawlers = [
    ...new Set(
        skins.map(skin => skin.brawler)
    )
].sort();

const brawlerFilter =
    document.getElementById("brawlerFilter");

brawlers.forEach(brawler => {

    const option =
        document.createElement("option");

    option.value = brawler;
    option.textContent = brawler;

    brawlerFilter.appendChild(option);

});


/* =========================
   KOLEKSİYON
========================= */

let owned = [];

try {

    const saved =
        localStorage.getItem("ownedSkins");

    if (saved) {
        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
            owned = parsed;
        }
    }

} catch {
    owned = [];
}


function saveOwned() {

    localStorage.setItem(
        "ownedSkins",
        JSON.stringify(owned)
    );

}


function toggleOwned(name) {

    if (owned.includes(name)) {

        owned =
            owned.filter(
                skin => skin !== name
            );

    } else {

        owned.push(name);

    }

    saveOwned();
    renderSkins();

}


/* =========================
   SKİNLERİ GÖSTER
========================= */

function renderSkins() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const selectedBrawler =
        document
            .getElementById("brawlerFilter")
            .value;

    const selectedRarity =
        document
            .getElementById("rarityFilter")
            .value;

    const grid =
        document.getElementById("skinGrid");


    const filtered =
        skins.filter(skin => {

            const searchMatch =
                skin.name
                    .toLowerCase()
                    .includes(search)
                ||
                skin.brawler
                    .toLowerCase()
                    .includes(search);

            const brawlerMatch =
                selectedBrawler === "all"
                ||
                skin.brawler === selectedBrawler;

            const rarityMatch =
                selectedRarity === "all"
                ||
                skin.rarity === selectedRarity;

            return (
                searchMatch &&
                brawlerMatch &&
                rarityMatch
            );

        });


    grid.innerHTML = "";


    if (filtered.length === 0) {

        grid.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px;
                color:#aaa;
            ">
                😕 Skin bulunamadı.
            </div>
        `;

    } else {

        filtered.forEach(skin => {

            const isOwned =
                owned.includes(skin.name);

            const card =
                document.createElement("div");

            card.className = "skin";

            card.innerHTML = `

                <h3>${skin.name}</h3>

                <div class="brawler">
                    ${skin.brawler}
                </div>

                <div class="price">
                    ${skin.price}
                </div>

                <span class="rarity">
                    ${getTurkishRarity(skin.rarity)}
                </span>

                <button class="owned ${
                    isOwned ? "active" : ""
                }">

                    ${
                        isOwned
                        ? "✅ Koleksiyonumda"
                        : "＋ Koleksiyonuma Ekle"
                    }

                </button>
            `;


            card
                .querySelector(".owned")
                .addEventListener(
                    "click",
                    () => toggleOwned(skin.name)
                );


            grid.appendChild(card);

        });

    }


    document
        .getElementById("collectionCount")
        .textContent = owned.length;

    document
        .getElementById("totalCount")
        .textContent = skins.length;

}


function getTurkishRarity(rarity) {

    const names = {

        Rare: "Ender",

        "Super Rare":
            "Süper Ender",

        Epic:
            "Destansı",

        Mythic:
            "Gizemli",

        Legendary:
            "Efsanevi"

    };

    return names[rarity] || rarity;

}


/* =========================
   HESABIM
========================= */

function showAccount() {

    const input =
        document.getElementById("playerTag");

    const result =
        document.getElementById("accountResult");

    let tag =
        input.value.trim();


    if (!tag) {

        result.innerHTML = `
            <p style="color:#ff5959;">
                ⚠️ Önce oyuncu etiketini yaz.
            </p>
        `;

        return;

    }


    if (!tag.startsWith("#")) {
        tag = "#" + tag;
    }


    result.innerHTML = `

        <h3 style="
            color:#ffd21f;
            margin-bottom:10px;
        ">
            🎮 Oyuncu
        </h3>

        <p style="
            font-size:22px;
            font-weight:bold;
        ">
            ${tag}
        </p>

        <p style="
            margin-top:15px;
            color:#aaa;
        ">
            Gerçek hesap bilgileri API bağlantısından
            sonra gösterilecek.
        </p>

    `;

}


/* =========================
   EVENTLER
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderSkins
    );

document
    .getElementById("brawlerFilter")
    .addEventListener(
        "change",
        renderSkins
    );

document
    .getElementById("rarityFilter")
    .addEventListener(
        "change",
        renderSkins
    );

document
    .getElementById("accountButton")
    .addEventListener(
        "click",
        showAccount
    );


renderSkins();

</script>

</body>
</html>
